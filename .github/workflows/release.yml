name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          CLI_RELEASES_S3_BUCKET: ${{ secrets.CLI_RELEASES_S3_BUCKET }}
          CLI_RELEASES_S3_ENDPOINT: ${{ secrets.CLI_RELEASES_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLI_RELEASES_S3_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLI_RELEASES_S3_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
