name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        # Moved from self-hosted MinIO to Cloudflare R2 (S3-compatible, same
        # goreleaser `blobs: provider: s3` config -- see .goreleaser.yaml).
        # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are still the right env
        # var names (the S3 SDK reads them regardless of actual provider),
        # but the secret *values* behind CLI_RELEASES_S3_ACCESS_KEY_ID/
        # CLI_RELEASES_S3_SECRET_ACCESS_KEY must be an R2 API token
        # (Cloudflare dashboard -> R2 -> Manage API Tokens), not the old
        # MinIO credentials -- rotate those secrets in this repo's GitHub
        # settings before the next tag push, this workflow can't do that
        # part for you.
        env:
          CLI_RELEASES_S3_BUCKET: ${{ vars.CLI_RELEASES_S3_BUCKET || secrets.CLI_RELEASES_S3_BUCKET || 'releases' }}
          CLI_RELEASES_S3_ENDPOINT: ${{ vars.CLI_RELEASES_S3_ENDPOINT || secrets.CLI_RELEASES_S3_ENDPOINT || 'https://90bb3d25c7129244bd604db183d93c1c.r2.cloudflarestorage.com' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLI_RELEASES_S3_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLI_RELEASES_S3_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
